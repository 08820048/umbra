<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Umbra · 设置</title>
    <script type="module" crossorigin src="/assets/index.html-CCzY8l7d.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
    <link rel="modulepreload" crossorigin href="/assets/i18n-CDGIzRKC.js">
    <link rel="modulepreload" crossorigin href="/assets/storage-Bl2qZ6PF.js">
    <link rel="modulepreload" crossorigin href="/assets/messaging-DSq-4YP6.js">
    <link rel="stylesheet" crossorigin href="/assets/index-C1EYZEjq.css">
  </head>
  <body>
    <main class="container">
      <header class="page-head">
        <h1 data-i18n="brand">Umbra·AI翻译</h1>
        <p class="subtitle" data-i18n="optionsSubtitle">选择模型服务商，填入 API Key，即可开始翻译。</p>
      </header>

      <form id="settings-form">
        <div class="page-layout">
          <nav class="settings-nav wt-select-list">
            <button
              type="button"
              class="settings-nav-item wt-select-item is-selected"
              data-section="provider"
            >
              <span data-i18n="secNavProvider">提供商设置</span>
              <svg
                class="wt-check"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M20 6 9 17l-5-5" />
              </svg>
            </button>
            <button
              type="button"
              class="settings-nav-item wt-select-item"
              data-section="prefs"
            >
              <span data-i18n="secPrefs">翻译偏好</span>
              <svg
                class="wt-check"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M20 6 9 17l-5-5" />
              </svg>
            </button>
          </nav>

          <div class="settings-content">
            <section id="section-provider" class="settings-section">
              <div class="provider-layout">
                <div id="provider-list" class="provider-list wt-select-list"></div>

                <div class="provider-panel">
                  <div class="panel-head">
                    <h3 id="panel-title"></h3>
                    <p id="panel-desc" class="wt-hint"></p>
                  </div>

                  <div class="field" id="model-field">
                    <span class="field-label" data-i18n="labelModel">模型</span>
                    <div id="model-dropdown"></div>
                    <input
                      id="modelCustom"
                      class="wt-input"
                      type="text"
                      data-i18n-placeholder="phCustomModel"
                      placeholder="输入模型 ID"
                      hidden
                    />
                  </div>

                  <label class="field" id="apiKey-field">
                    <span class="field-label" data-i18n="labelApiKey">API Key</span>
                    <input
                      id="apiKey"
                      class="wt-input"
                      type="password"
                      autocomplete="off"
                    />
                    <small class="wt-hint" id="key-hint"></small>
                  </label>

                  <label class="field" id="baseUrl-field">
                    <span class="field-label" data-i18n="labelBaseUrl">API Base URL</span>
                    <input id="baseUrl" class="wt-input" type="url" />
                    <small class="wt-hint" id="baseUrl-hint"></small>
                  </label>
                </div>
              </div>
            </section>

            <section id="section-prefs" class="settings-section" hidden>
              <div class="settings-panel">
                <div class="field">
                  <span class="field-label" data-i18n="labelLang">目标语言</span>
                  <div id="lang-dropdown"></div>
                </div>
                <div class="field">
                  <label class="switch-row">
                    <span class="field-label" data-i18n="labelAutoTranslate">选中立即翻译</span>
                    <span class="wt-switch">
                      <input id="autoTranslate" type="checkbox" role="switch" />
                    </span>
                  </label>
                  <small class="wt-hint" data-i18n="hintAutoTranslate"
                    >开启后选中文本立即翻译，不再显示工具条。</small
                  >
                </div>
                <div class="field">
                  <label class="switch-row">
                    <span class="field-label" data-i18n="labelStreaming">流式输出</span>
                    <span class="wt-switch">
                      <input id="streaming" type="checkbox" role="switch" />
                    </span>
                  </label>
                  <small class="wt-hint" data-i18n="hintStreaming"
                    >逐字显示翻译过程，关闭后一次性返回结果。</small
                  >
                </div>
              </div>
            </section>
          </div>
        </div>

        <div class="actions">
          <button type="submit" id="save-btn" class="wt-btn" data-i18n="actSave">保存设置</button>
          <button type="button" id="test-btn" class="wt-btn secondary" data-i18n="actTest">测试翻译</button>
        </div>
        <p id="status" class="status" role="status"></p>
      </form>

      <footer class="page-footer">
        <span data-i18n="footerBy">© 2025 Umbra. Made with love by</span>
        <a href="https://x.com/xuyidev" target="_blank" rel="noopener noreferrer">XuYi</a>
        ·
        <a
          href="https://gist.github.com/08820048/b2ba7bf47854d6eb32a8ac3ab2d1cff3"
          target="_blank"
          rel="noopener noreferrer"
          data-i18n="privacyPolicy"
          >Privacy policy</a
        >
      </footer>
    </main>
  </body>
</html>
